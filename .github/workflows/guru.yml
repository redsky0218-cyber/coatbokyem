name: guru-tracker

on:
  schedule:
    # 미국 장마감 후 매일 (월-금 21:30 UTC = 한국 화-토 06:30)
    - cron: "30 21 * * 1-5"
  workflow_dispatch:   # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: guru-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run guru tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python guru_tracker.py

      - name: Persist state (13F 상태 저장)
        run: |
          if [ -n "$(git status --porcelain guru_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add guru_state.json
            git commit -m "update guru state [skip ci]"
            git push
          else
            echo "상태 변화 없음 - 커밋 생략"
          fi
